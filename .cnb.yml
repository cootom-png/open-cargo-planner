main:
  push:
    - stages:
        - name: 安装依赖
          image: node:22
          script: npm ci
        - name: 运行测试
          image: node:22
          script: npm test
        - name: 类型检查
          image: node:22
          script: npm run typecheck

$:
  vscode:
    - runner:
        cpus: 2
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: npm run dev
            keepAliveTimeout: 2h
            daemon: true
      stages:
        - name: 安装依赖
          script: npm ci
