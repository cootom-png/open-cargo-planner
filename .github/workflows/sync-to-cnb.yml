name: 同步到 CNB

# GitHub 为权威源：每次 push 到 main（含合并 PR）后，自动把代码镜像同步到 CNB 仓库，
# 并触发 CNB 上 .cnb.yml 定义的构建 / 工作区预览。
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动一键同步

concurrency:
  group: sync-to-cnb
  cancel-in-progress: false

jobs:
  mirror:
    name: 镜像推送 GitHub → CNB
    runs-on: ubuntu-latest
    # 需要两个 GitHub 仓库 Secret（在 Settings → Secrets and variables → Actions 配置）：
    #   CNB_USERNAME  — CNB 用户名（如 morrowfactory）
    #   CNB_TOKEN     — CNB 访问令牌（个人访问令牌 / 部署令牌），需具备目标仓库写权限
    if: ${{ secrets.CNB_USERNAME != '' && secrets.CNB_TOKEN != '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 同步到 CNB 仓库
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_TARGET_REPO: ${{ vars.CNB_TARGET_REPO }}
        run: |
          TARGET="${CNB_TARGET_REPO:-morrowfactory/open-cargo-planner}"
          AUTH_URL="https://${CNB_USERNAME}:${CNB_TOKEN}@cnb.cool/${TARGET}.git"
          git remote add cnb "${AUTH_URL}" 2>/dev/null || git remote set-url cnb "${AUTH_URL}"
          # 推送 main 分支（含所有历史 tag），触发 CNB 端构建
          git push --force cnb main:main
          git push --tags --force cnb || true
