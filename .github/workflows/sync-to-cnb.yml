name: 同步到 CNB

# GitHub 为权威源：每次 push 到 main（含合并 PR）后，自动把代码镜像同步到 CNB 仓库，
# 并触发 CNB 上 .cnb.yml 定义的构建 / 工作区预览。
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动一键同步

concurrency:
  group: sync-to-cnb
  cancel-in-progress: false

jobs:
  mirror:
    name: 镜像推送 GitHub → CNB
    runs-on: ubuntu-latest
    # 需要两个 GitHub 仓库 Secret（在 Settings → Secrets and variables → Actions 配置）：
    #   CNB_USERNAME  — CNB 用户名（如 morrowfactory）
    #   CNB_TOKEN     — CNB 访问令牌（个人访问令牌 / 部署令牌），需具备目标仓库写权限
    steps:
      - name: 检查 CNB 同步凭据
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          test -n "${CNB_USERNAME}" || { echo "缺少 GitHub Secret: CNB_USERNAME"; exit 1; }
          test -n "${CNB_TOKEN}" || { echo "缺少 GitHub Secret: CNB_TOKEN"; exit 1; }

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 配置 CNB Git 凭据
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'protocol=https\nhost=cnb.cool\nusername=%s\npassword=%s\n\n' "${CNB_USERNAME}" "${CNB_TOKEN}" | git credential approve
          FILLED="$(printf 'protocol=https\nhost=cnb.cool\n\n' | git credential fill)"
          test "$(printf '%s\n' "${FILLED}" | sed -n 's/^username=//p')" = "${CNB_USERNAME}" || { echo "CNB Git 凭据未写入 runner"; exit 1; }

      - name: 同步到 CNB 仓库
        env:
          CNB_TARGET_REPO: ${{ vars.CNB_TARGET_REPO }}
        run: |
          TARGET="${CNB_TARGET_REPO}"
          git remote add cnb "https://cnb.cool/${TARGET}.git" 2>/dev/null || git remote set-url cnb "https://cnb.cool/${TARGET}.git"
          # 读取 CNB 当前 main，使用带 lease 的强制更新：若 CNB 在检查后被他人修改则拒绝覆盖。
          CNB_HEAD="$(git ls-remote cnb refs/heads/main | awk '{print $1}')"
          if [ -n "${CNB_HEAD}" ]; then
            git push --force-with-lease=refs/heads/main:${CNB_HEAD} cnb main:main
          else
            git push cnb main:main
          fi
          # tag 只做普通同步，若 CNB 已存在不同内容的同名 tag 则保留 CNB tag 并给出提示。
          git push --tags cnb || echo "部分 tag 未同步；main 分支已完成同步。"
